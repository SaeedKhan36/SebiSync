# Render blueprint. Create both services with: New → Blueprint → point at this repo.
#
# Only the two server-side services live here. The frontend (apps/web) deploys
# to Vercel and the database is Neon — neither is managed by Render.
#
# No secret values appear in this file. Every sensitive key is declared with
# `sync: false`, which makes Render prompt for it once in the dashboard and keep
# it out of git. Do not replace any of them with a literal.

services:
  # ---------------------------------------------------------------- worker ---
  - type: web
    name: sebisync-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    # Repo root, not apps/worker: the image needs packages/ and bun.lock to
    # resolve the workspace graph. See the Dockerfile's opening comment.
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Neon connection string. Use the POOLED host for the worker — it opens a
      # connection per request and will exhaust a direct Neon endpoint.
      - key: DATABASE_URL
        sync: false

      # Comma-separated allowlist for CORS. Must contain the Vercel production
      # URL, and any preview URL you intend to demo from. Getting this wrong
      # does not fail loudly — every tRPC call just returns "Failed to fetch".
      - key: WEB_ORIGIN
        sync: false

      # Base URL of the docling sidecar service below, e.g.
      # https://sebisync-docling.onrender.com — no trailing slash.
      - key: DOCLING_SIDECAR_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false

      # Cloudflare R2 — stores the uploaded circular PDFs and evidence files.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

      # Guards POST /internal/detect-gaps. Generate a fresh random value for
      # production rather than reusing the local one.
      - key: INTERNAL_API_SECRET
        generateValue: true

      # Optional. Gap notification email; omit both and notifyGap becomes a
      # no-op that returns 0 recipients rather than failing detection.
      - key: RESEND_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false

      # Optional. Trigger.dev handles the async checklist fan-out on publish.
      # Without these, publish still succeeds and degrades to fanOutStatus
      # FAILED with an explanatory error.
      - key: TRIGGER_SECRET_KEY
        sync: false
      - key: TRIGGER_PROJECT_REF
        sync: false

  # ------------------------------------------------------- docling sidecar ---
  # PDF parsing. The worker calls this over HTTP during ingestion; it holds no
  # state and needs no database.
  #
  # NOT on the free plan, and that is not a preference. The image bundles
  # docling plus paddleocr/paddlepaddle, which needs well over Render free's
  # 512 MB at model-load time — on free it OOMs partway through the first parse
  # and the document is left stuck in PARSING.
  - type: web
    name: sebisync-docling
    runtime: docker
    dockerfilePath: ./services/docling-sidecar/Dockerfile
    dockerContext: ./services/docling-sidecar
    plan: standard
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
